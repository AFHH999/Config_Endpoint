- name: Update pacman cache if stale
  community.general.pacman:
    update_cache: true
  become: true
  when: ansible_os_family == "Archlinux"

- name: Install Official packages in Arch
  community.general.pacman:
    name: "{{ base_required_packages }}"
    state: present
  become: true
  when: ansible_os_family == "Archlinux"

- name: Install Official packages daily_driver
  community.general.pacman:
    name: "{{ base_host_only_packages }}"
    state: present
  become: true
  when: system_role == "daily_driver"

- name: Check if pynvim is installed
  ansible.builtin.command: pipx list
  register: base_pipx_list
  changed_when: false
  become: true
  become_user: "{{ ansible_env.SUDO_USER | default(ansible_user_id) }}"

- name: Install pynvim
  ansible.builtin.pip:
    name: pynvim
    state: present
  become: true
