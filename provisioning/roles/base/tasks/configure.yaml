- name: Download oh-my-zsh
  ansible.builtin.shell: |
    set -e
    set -o pipefail
    wget -O- https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh | CHSH=no RUSZSH=no sh
  args:
    creates: "{{ ansible_env.HOME }}/.oh-my-zsh"

- name: Download the dotfiles repo
  ansible.builtin.git:
    repo: 'https://github.com/AFHH999/Dotfiles'
    dest: "{{ ansible_env.HOME }}/Dotfiles"
    version: main
    update: true
    force: true
  become: true
  become_user: "{{ ansible_user_id }}"
  when: ansible_os_family == "Archlinux"

- name: Make sure the dir exists
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/Dotfiles"
    state: directory
    mode: '0755'
  when: ansible_os_family == "Archlinux"

- name: Remove the stock .zshrc file
  ansible.builtin.file: 
    path: "{{ ansible_env.HOME }}/.zshrc"
    state: absent

- name: Stow the config dotfiles
  ansible.builtin.shell: |
    set -e
    for pkg in */; do
        if [ -d "$pkg" ] && [ "$pkg" != ".git/" ]; then 
        stow -v -t "${pkg%/}"
      fi
    done
  args:
    chdir: "{{ ansible_env.HOME }}/Dotfiles"
    executable: /bin/bash
  become: true
  become_user: "{{ ansible_user_id }}"
  when: ansible_os_family == "Archlinux"

- name: Set zsh as default shell
  ansible.builtin.shell: "chsh -s $(which zsh) {{ ansible_user_id }}"
  become: true
