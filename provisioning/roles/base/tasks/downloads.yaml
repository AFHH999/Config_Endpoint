- name: Check if cargo is installed
  ansible.builtin.command: command -v cargo
  register: cargo_exists
  ignore_errors: true
  changed_when: false
  become: true
  become_user: "{{ ansible_env.SUDO_USER | default(ansible_user_id) }}"

- name: Download rust_up installer
  ansible.builtin.get_url:
      url: https://sh.rustup.rs
      dest: /tmp/sh.rustup.rs
      mode: '0755'
  when: cargo_exists.rc != 0

- name: Install Cargo via rustup
  ansible.builtin.shell: /tmp/sh.rustup.rs -y
  environment:
    PATH: "{{ ansible_env.PATH }}:/home/{{ ansible_env.SUDO_USER | default(ansible_user_id) }}/.cargo/bin"
    HOME: "/home/{{ ansible_env.SUDO_USER | default(ansible_user_id) }}"
  when: cargo_exists.rc != 0
  become: true
  become_user: "{{ ansible_env.SUDO_USER | default(ansible_user_id) }}"
  changed_when: true
