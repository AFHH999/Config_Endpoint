base_required_packages: # Base CLI utilities required across both your physical PC and your VM
  # --- System Documentation & Foundations ---
  - base
  - base-devel
  - man-db
  - man-pages
  - stow                    # Dotfile symlink management
  - pacman-contrib          # Backend system update metrics

  # --- Shell, Navigation & Terminal Rices ---
  - zsh
  - zsh-completions
  - zsh-syntax-highlighting
  - atuin                   # Shell history synchronization
  - zoxide                  # Smart directory jumping
  - fzf                     # Fuzzy selection utility
  - bat                     # Syntax-highlighted cat replacement
  - fd                      # Search alternative to find

  # --- System Management & Core CLI Tools ---
  - git
  - wget
  - jq                      # Command-line JSON formatting engine
  - tmux
  - neovim
  - ghostty                 # Modern hardware-accelerated terminal emulator
  - yazi                    # High-efficiency terminal file manager

  # --- Languages & Quality Checks ---
  - python
  - python-pipx
  - ansible-lint            # Strict automated infrastructure verification

# Heavy metrics tools we only want running natively on your laptop hardware
base_host_only_packages:
  - btop                    # Interactive system resource visualization dashboard
  - fastfetch               # System hardware configuration summary display
