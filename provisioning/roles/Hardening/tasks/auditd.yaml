tasks:
  - name: Deploy auditd rules
    ansible.builtin.template:
      src: auditd_rules.conf.j2
      dest: /etc/audit/rules.d/audit_rules
      owner: root
      group: root
      mode: '0640'
    notify: restart auditd

  - name: Enable auditd
    ansible.builtin.systemd:
      name: auditd
      enable: yes
      daemon_reload: yes

# Handlers
handlers:
  - name: restart auditd
    ansible.builtin.systemd:
      name: auditd
      state: restarted
