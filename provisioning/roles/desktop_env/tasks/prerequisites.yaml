- name: Install Official packages
  community.general.pacman:
    name: "{{ required_packages }}"
    state: present
  when: ansible_os_family == "Archlinux"

- name: Install AUR packages with yay
  kewlfft.aur.aur:
    name: "{{ aur_packages }}"
    use: yay
    state: present
  become: true
  become_user: aur_builder


