- name: Basic set-up for a pc
  become: true
  gather_facts: yes
  hosts: all
  vars:

  required_packages:
    # Core Dev & RE
    - man-db
    - man-pages
    - base
    - base-devel
    - git
    - wget
    - gdb
    - gef
    - ghidra
    - radare2
    - binwalk
    - python-pwntools
    - strace
    - ltrace
    - valgrind
    - python-pip
    - lynis
    - btop
    - checksec
    - nasam
    - yasm
    - wireshark-qt
    - tcpdump
    - lldb
    - python-pycryptodomex
    - python-requests
    - upx
    - binutils

    # Editor & Terminal
    - nautilus
    - neovim
    - ghostty
    - tmux
    - jq
    - ttf-jetbrains-mono-nerd 3.4.0-2
    - zoxide
    - pacman-contrib
    - rofi
    - atuin
    - yazi
    - zsh
    - zsh-completitions
    - fzf
    - bat
    - fastfetch
    - fd

    # i3
    - i3-vm
    - i3status
    - i3lock

  aur_packages:
  - dunst
  - feh
  - mpv
  - picom
  - nemo
  - cinnamon-translations
  - network-manager-applet
  - xss-lock ttf-fira-code
  - nerd-fonts-fira-code
  - brightnessctl
  - alsa
  - polkit
  - polkit-gnome
  - python-pynvim

  tasks:
    - name: Debug OS Facts
      debug:
        msg:
        - "Family: {{ ansible_os_family }}"
        - "Distribution: {{ ansible_distribution }}"
        - "Version: {{ ansible_distribution_version }}"

    - name: Update pacman
      pacman:
        update_cache: yes
        valid_time: 3600
      when: ansible_os_family == "Arch"

    - name: Install Official packages in Arch
      pacman:
        name: "{{ required_packages }}"
        state: present
      when: ansible_os_family == "Arch"

    - name: Install AUR packages
      community.general.yay:
        name: "{{ aur_packages }}"
        state: present
      when: ansible_os_family == "Arch"

    - name: Clone the config repo i3 
      ansible.builtin.git:
        repo: 'https://github.com/it2000-the-original/i3wm-Dotfiles i3'
        dest: '~/'
        version: main
        update: yes
      become_user: "{{ ansible_user_id }}" 
      when: ansible_os_family == "Arch"

    - name: Give execution permision to the script
      ansible.builtin.file:
        path: "{{ ansible_env.HOME }}/i3/install.sh"
        mode: 'u+rwx, go+rx'
        state: file
      become_user: "{{ ansible_user_id }}" 
      when: ansible_os_family == "Arch"

    - name: Run the install script for the i3 repo and create a mark
      command: ./install.sh && touch exists_already.txt
      args:
        chdir: "{{ ansible_env.HOME }}/i3"
        creates: "{{ ansible_env.HOME }}/i3/exists_already.txt"
        mode: 'u+rwx, go+rx'
      become_user: "{{ ansible_user_id }}"

    - name: Install Rust/cargo
      become: false
      block:
        
      - name: check if cargo is installed
        ansible.builtin.command: command -v cargo
        register: cargo_exists
        ignore_errors: true
        changed_when: false

      - name: Download rust_up installer
        ansible.builtin.get_url: 
            url: https://sh.rust_up.rs
            dest: /tmp/sh.rustup.rs
            mode: 'u+rwx, go+rx'
        when: cargo_exists is failed

      - name: Install Cargo
        ansible.builtin.shell: /tmp/sh.rustup.rs -y
        when: cargo_exists is failed




